<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>めしノート</title>
<meta name="theme-color" content="#2F8F5B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="めしノート">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  /* 文字 */
  --sumi:#16231C; --soft:#66736C;
  /* 面 */
  --bg:#F0F6F1; --paper:#FFFFFF; --line:#DCE6DE;
  /* ブランドの緑（目にやさしい落ち着いた緑） */
  --brand:#2F8F5B; --brand-deep:#1F6B42; --brand-tint:#E4F2E9; --brand-soft:#C9E5D5;
  /* 役割の色 */
  --ai:#3A7BD5; --kaki:#E2603F; --yamabuki:#EFA637; --wakakusa:#35A06B;
  /* 書体：明朝はやめ、やわらかい丸ゴシック系でそろえる */
  --font-base:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --font-round:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0; padding:0; background:var(--bg)}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Noto Sans JP",system-ui,sans-serif;
  color:var(--sumi); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
#app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button{font-family:inherit; cursor:pointer; color:inherit}
input,select{font-family:inherit; color:var(--sumi)}
:focus-visible{outline:2px solid var(--ai); outline-offset:2px}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
.num{font-family:var(--font-num); font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums}

/* ヘッダー */
.top{position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(12px + env(safe-area-inset-top)) 18px 8px; border-bottom:1px solid var(--line)}
.brand{font-size:14px; letter-spacing:.22em; color:var(--soft)}
.datebar{display:flex; align-items:center; gap:6px; margin-top:4px}
.date{font-size:21px; font-weight:700}
.nav{border:none; background:none; font-size:22px; color:var(--soft); padding:0 8px; line-height:1}
.nav:disabled{opacity:.25}
.main{padding:16px 18px 0}

/* サマリー */
.summary{display:flex; gap:16px; align-items:center}
.ring-wrap{position:relative; flex:0 0 132px; height:132px}
.ring-in{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
.ring-in b{font-size:33px; line-height:1}
.ring-in span{font-size:11px; color:var(--soft)}
.summary-side{flex:1; min-width:0}
.remain{font-size:13px; color:var(--soft); margin:0 0 10px}
.remain b{font-size:19px; color:var(--sumi); margin:0 2px}
.pfc{display:flex; flex-direction:column; gap:7px}
.pfc-row{display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:8px}
.pfc-label{font-size:11px; color:var(--soft)}
.pfc-track{height:6px; background:var(--line); border-radius:3px; overflow:hidden}
.pfc-fill{height:100%; border-radius:3px; transition:width .5s ease}
.pfc-num{font-size:12px; min-width:56px; text-align:right}
.pfc-num i{font-style:normal; color:var(--soft); font-size:10px}

.strip{display:flex; align-items:center; gap:18px; margin:16px 0 6px; padding:10px 14px;
  background:var(--paper); border:1px solid var(--line); border-radius:12px}
.strip-item{display:flex; align-items:baseline; gap:4px}
.strip-item span{font-size:11px; color:var(--soft)}
.strip-item b{font-size:20px}
.strip-item i{font-style:normal; font-size:11px; color:var(--soft)}
.strip-item em{font-style:normal; font-size:12px; color:var(--soft)}
.strip-dots{margin-left:auto; display:flex; gap:4px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--line)}
.dot-on{background:var(--wakakusa)}

/* タイムライン */
.tl{display:flex; margin-top:14px}
.tl-rail{position:relative; width:46px; flex:0 0 46px}
.tl-line{position:absolute; left:33px; top:6px; bottom:6px; width:2px; border-radius:1px;
  background:linear-gradient(180deg,#C8D6E6 0%,#F0E3C6 22%,#F6EDD8 50%,#E8D3B4 74%,#3C4A6B 100%)}
.tl-tick{position:absolute; left:0; width:40px; text-align:right; transform:translateY(-50%)}
.tl-tick span{font-size:10px; color:var(--soft); background:var(--bg); padding:1px 3px}
.tl-body{flex:1; min-width:0; padding-left:16px}
.tl-group{position:relative}
.tl-group + .tl-group{margin-top:14px}
.tl-dot{position:absolute; left:-19px; top:7px; width:9px; height:9px; border-radius:50%; border:2px solid var(--bg)}
.tl-head{display:flex; align-items:baseline; gap:8px; margin-bottom:6px}
.tl-time{font-size:12px; color:var(--soft)}
.tl-meal{font-size:14px; font-weight:700}
.tl-kcal{margin-left:auto; font-size:16px}
.tl-kcal i{font-style:normal; font-size:10px; color:var(--soft); margin-left:2px}
.tl-items{display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:12px; overflow:hidden}
.item{display:flex; align-items:center; gap:10px; width:100%; padding:9px 11px; background:var(--paper); border:none; text-align:left}
.item:active{background:#F2F2EC}
.item-thumb{width:38px; height:38px; border-radius:8px; object-fit:cover; flex:0 0 38px}
.item-thumb-blank{display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--soft); font-size:15px}
.item-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.item-name{font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item-portion{font-size:11px; color:var(--soft)}
.item-kcal{font-size:14px; color:var(--soft)}

.empty{margin:36px 4px; padding:28px 22px; background:var(--paper); border:1px dashed var(--line); border-radius:14px; text-align:center}
.empty-title{font-size:16px; font-weight:700; margin:0 0 6px}
.empty-sub{font-size:13px; color:var(--soft); line-height:1.7; margin:0 0 18px}

/* AI栄養士 */
.coach{margin-top:20px; padding:14px 16px; background:var(--paper); border:1px solid var(--line); border-radius:14px}
.coach-head{display:flex; gap:10px; align-items:center; margin-bottom:10px}
.coach-avatar{width:34px; height:34px; border-radius:50%; background:var(--ai); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px}
.coach-head strong{font-size:14px}
.coach-sub{font-size:11px; color:var(--soft); margin:2px 0 0}
.coach-text{font-size:14px; line-height:1.85; margin:0 0 12px}

/* ボタン */
.btn{width:100%; padding:12px 16px; border-radius:11px; border:1px solid var(--sumi); background:transparent; font-size:14px}
.btn-primary{background:var(--sumi); color:#fff}
.btn-primary:disabled{opacity:.3}
.btn-ghost{border-color:var(--line); color:var(--soft)}
.btn-danger{margin-top:14px; border-color:var(--kaki); color:var(--kaki)}
.link{background:none; border:none; color:var(--ai); font-size:13px; padding:6px 0}
.link-danger{color:var(--kaki)}
.fab{position:fixed; right:18px; bottom:calc(88px + env(safe-area-inset-bottom)); width:54px; height:54px; border-radius:50%;
  background:var(--sumi); color:#fff; border:none; font-size:24px; line-height:1; z-index:6; box-shadow:0 6px 18px rgba(30,38,34,.28)}
@media (min-width:520px){ .fab{right:calc(50% - 240px + 18px)} }

.tabbar{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  display:flex; background:var(--paper); border-top:1px solid var(--line); z-index:7; padding-bottom:env(safe-area-inset-bottom)}
.tabbtn{flex:1; padding:14px 0 16px; border:none; background:none; font-size:13px; color:var(--soft)}
.tabbtn-on{color:var(--sumi); font-weight:700; box-shadow:inset 0 2px 0 var(--sumi)}

/* シート */
#sheet:empty{display:none}
.sheet-wrap{position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center}
.sheet-scrim{position:absolute; inset:0; background:rgba(24,30,26,.42)}
.sheet{position:relative; width:100%; max-width:480px; max-height:92vh; background:var(--bg);
  border-radius:18px 18px 0 0; display:flex; flex-direction:column; animation:rise .25s ease}
@keyframes rise{from{transform:translateY(24px); opacity:.6} to{transform:none; opacity:1}}
.sheet-grip{width:38px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 0}
.sheet-top{display:flex; align-items:center; justify-content:space-between; padding:8px 18px 4px}
.sheet-top strong{font-size:15px}
.slot{display:flex; gap:8px; align-items:center; padding:6px 18px 10px}
.chips{display:flex; gap:6px; flex:1}
.chip{padding:7px 11px; border-radius:20px; border:1px solid var(--line); background:var(--paper); font-size:12px; color:var(--soft)}
.chip-on{background:var(--sumi); color:#fff; border-color:var(--sumi)}
.time{border:1px solid var(--line); border-radius:9px; padding:7px 8px; font-size:13px; background:var(--paper)}
.tabs{display:flex; gap:20px; padding:0 18px; border-bottom:1px solid var(--line)}
.tab{border:none; background:none; padding:9px 0; font-size:13px; color:var(--soft)}
.tab-on{color:var(--sumi); font-weight:700; box-shadow:inset 0 -2px 0 var(--sumi)}
.sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 18px; flex:1}
.photo-slot{padding:34px 18px; text-align:center; font-size:13px; color:var(--soft); border:1px dashed var(--line); border-radius:12px; background:var(--paper); line-height:1.7}
.photo-preview{width:100%; height:150px; object-fit:cover; border-radius:12px; display:block}
.photo-btns{display:flex; gap:8px; margin-top:12px}
.input{width:100%; border:1px solid var(--line); border-radius:9px; padding:10px 11px; font-size:16px; background:var(--paper)}
.input-name{font-weight:700}
.input-sub{margin-top:6px; font-size:14px}
.hint{font-size:12px; color:var(--soft); margin:12px 0 6px; line-height:1.7}
.results{display:flex; flex-direction:column; margin:8px 0}
.result{display:flex; justify-content:space-between; align-items:center; padding:10px 2px; border:none; border-bottom:1px solid var(--line); background:none; text-align:left; width:100%}
.result b{font-size:14px; font-weight:600}
.result i{font-style:normal; font-size:11px; color:var(--soft); margin-left:7px}
.result-kcal{font-size:12px; color:var(--soft)}
.status{display:flex; align-items:center; gap:9px; margin:12px 0; padding:10px 12px; border-radius:10px; font-size:12.5px; line-height:1.6}
.status-loading{background:#E7ECF4; color:var(--ai)}
.status-note{background:#EAF0E4; color:#3F6B29}
.status-error{background:#F6E7E0; color:var(--kaki)}
.detail{display:block; margin-top:6px; font-style:normal; font-size:11px; opacity:.75; word-break:break-all}
.spin{width:13px; height:13px; border-radius:50%; border:2px solid currentColor; border-top-color:transparent; animation:sp .8s linear infinite; flex:0 0 13px}
@keyframes sp{to{transform:rotate(360deg)}}
.drafts{display:flex; flex-direction:column; gap:12px; margin-top:6px}
.draft{padding:12px; border:1px solid var(--line); border-radius:12px; background:var(--paper)}
.draft-top{display:flex; gap:8px; align-items:center}
.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:9px}
.numf{display:flex; flex-direction:column; gap:3px}
.numf span{font-size:10px; color:var(--soft)}
.numf input{width:100%; border:1px solid var(--line); border-radius:8px; padding:7px 4px; font-size:15px; background:var(--bg); text-align:center}
.warn{font-size:11px; color:var(--kaki); margin:8px 0 0; line-height:1.6}
.sheet-foot{display:flex; align-items:center; gap:12px; padding:12px 18px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--paper)}
.foot-sum{display:flex; align-items:baseline; gap:4px; flex-wrap:wrap}
.foot-sum b{font-size:22px}
.foot-sum span{font-size:11px; color:var(--soft)}
.foot-sum i{font-style:normal; font-size:11px; color:var(--soft); width:100%}
.sheet-foot .btn{width:auto; flex:1; margin-left:auto}

/* カード類 */
.dash{display:flex; flex-direction:column; gap:14px; padding-top:2px}
.card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:15px 16px}
.h{font-size:13px; font-weight:700; margin:0 0 12px}
.cap{font-size:11.5px; color:var(--soft); line-height:1.75; margin:10px 0 0}
.legend{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; flex:0 0 118px}
.legend li{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--soft)}
.legend b{margin-left:auto; color:var(--sumi); font-size:13px}
.sw{width:9px; height:9px; border-radius:2px}
.donut-wrap{display:flex; align-items:center; gap:10px}
.split{display:flex; flex-direction:column; gap:10px}
.split-row{display:grid; grid-template-columns:44px 1fr 42px; align-items:center; gap:9px; font-size:12px}
.split-track{height:8px; background:var(--bg); border-radius:4px; overflow:hidden}
.split-fill{height:100%; background:var(--ai); opacity:.8; border-radius:4px}
.split-row b{text-align:right; font-weight:600}
.form{display:flex; flex-direction:column; gap:11px}
.f{display:flex; flex-direction:column; gap:5px; flex:1}
.f span{font-size:11px; color:var(--soft)}
.f2{display:flex; gap:10px}
.calc{display:flex; flex-direction:column; gap:7px; margin:14px 0 12px; padding:12px 14px; background:var(--bg); border-radius:11px}
.calc div{display:flex; align-items:baseline; gap:6px; font-size:12px; color:var(--soft)}
.calc b{margin-left:auto; font-size:16px; color:var(--sumi)}
.calc-main{padding-top:8px; border-top:1px solid var(--line)}
.calc-main b{font-size:24px; color:var(--kaki)}
.slider{display:grid; grid-template-columns:64px 1fr 40px; align-items:center; gap:10px; margin-bottom:10px}
.slider span{font-size:12px; color:var(--soft)}
.slider b{text-align:right; font-size:13px}
.slider input[type=range]{accent-color:var(--ai)}
.testout{margin:10px 0 0; font-size:12px; line-height:1.7; color:var(--soft); word-break:break-all}
.spacer{height:26px}

/* ============================================================
   見た目の刷新：落ち着いた緑を基調に、丸みのあるやさしい印象へ
   （上の指定を後から上書きする形でまとめています）
   ============================================================ */
body{font-family:var(--font-base)}

/* --- ヘッダーは緑の帯に --- */
.top{
  background:var(--brand); border-bottom:none; color:#fff;
  padding:calc(12px + env(safe-area-inset-top)) 18px 16px;
  border-radius:0 0 22px 22px; box-shadow:0 2px 12px rgba(31,107,66,.18);
}
.brand{font-family:var(--font-round); font-size:12px; letter-spacing:.2em; color:rgba(255,255,255,.8)}
.datebar{margin-top:6px}
.date{font-family:var(--font-round); font-size:20px; font-weight:700; color:#fff}
.nav{color:rgba(255,255,255,.9)}
.nav:disabled{opacity:.35}
.main{padding:18px 18px 0}

/* --- 見出し・カード --- */
h2.h, .h{font-family:var(--font-round); font-size:14px; color:var(--sumi)}
.card{border:none; border-radius:var(--r); padding:17px 17px; box-shadow:0 1px 3px rgba(22,35,28,.06)}
.dash{gap:13px}

/* --- 今日のサマリー --- */
.ring-in b{font-size:35px; color:var(--brand-deep)}
.remain b{font-size:20px; color:var(--brand-deep)}
.pfc-track{background:var(--brand-tint); height:7px; border-radius:4px}
.pfc-fill{border-radius:4px}
.strip{border:none; border-radius:var(--r); box-shadow:0 1px 3px rgba(22,35,28,.06); padding:12px 15px}
.strip-item b{font-size:21px; color:var(--brand-deep)}
.dot-on{background:var(--brand)}

/* --- タイムライン --- */
.tl-line{background:linear-gradient(180deg,#BFE0CC 0%,#EFE2BE 30%,#F6EFD9 52%,#D8E7DC 78%,#2F8F5B 100%)}
.tl-tick span{background:var(--bg)}
.tl-meal{font-family:var(--font-round)}
.tl-items{border:none; border-radius:14px; background:var(--line)}
.item:active{background:var(--brand-tint)}
.item-thumb-blank{background:var(--brand-tint); color:var(--brand)}

/* --- ボタン --- */
.btn{
  border-radius:14px; border:1.5px solid var(--brand); color:var(--brand-deep);
  background:var(--paper); font-family:var(--font-round); font-weight:700; font-size:14.5px;
  padding:13px 16px;
}
.btn-primary{background:var(--brand); border-color:var(--brand); color:#fff; box-shadow:0 2px 8px rgba(47,143,91,.28)}
.btn-primary:disabled{opacity:.35; box-shadow:none}
.btn-ghost{border-color:var(--line); color:var(--soft); background:var(--paper)}
.btn-danger{border-color:var(--kaki); color:var(--kaki)}
.link{color:var(--brand-deep); font-weight:700}
.link-danger{color:var(--kaki)}
.fab{
  width:60px; height:60px; background:var(--brand); font-size:29px; font-weight:300;
  box-shadow:0 8px 20px rgba(31,107,66,.34);
}
.fab:active{transform:scale(.94)}

/* --- 下のタブバー --- */
.tabbar{border-top:1px solid var(--line); box-shadow:0 -2px 12px rgba(22,35,28,.05)}
.tabbtn{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 10px; font-size:11px; font-family:var(--font-round); font-weight:700;
}
.ti{width:23px; height:23px; flex:none}
.tabbtn-on{color:var(--brand); box-shadow:none}

/* --- 記録シート --- */
.sheet{border-radius:22px 22px 0 0}
.sheet-top strong{font-family:var(--font-round); font-size:16px}
.chip{border-radius:20px; border-color:var(--line); font-family:var(--font-round); font-weight:700; font-size:12.5px}
.chip-on{background:var(--brand); border-color:var(--brand); color:#fff}
.tab{font-family:var(--font-round); font-weight:700; font-size:13.5px}
.tab-on{color:var(--brand); box-shadow:inset 0 -2.5px 0 var(--brand)}
.input{border-radius:12px; border-color:var(--line)}
.input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint)}
.numf input:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-tint)}
.photo-slot{border-radius:14px; border-color:var(--brand-soft); background:var(--brand-tint); color:var(--brand-deep)}
.photo-preview{height:170px; border-radius:14px}
.result{padding:12px 2px}
.result b{font-size:14.5px; font-weight:700}
.status{border-radius:12px; font-size:13px}
.status-loading{background:#E8F0FB; color:#2C5FA8}
.status-note{background:var(--brand-tint); color:var(--brand-deep)}
.status-error{background:#FBEAE5; color:#B8462A}
.draft{border:none; border-radius:14px; background:var(--brand-tint)}
.draft .input{background:var(--paper)}
.numf input{background:var(--paper); border-radius:10px}
.sheet-foot{border-top:1px solid var(--line)}
.foot-sum b{font-size:24px; color:var(--brand-deep)}

/* --- 目標タブ --- */
.calc{background:var(--brand-tint); border-radius:14px; padding:14px 16px}
.calc b{color:var(--brand-deep)}
.calc-main{border-top:1px solid var(--brand-soft)}
.calc-main b{font-size:27px; color:var(--brand-deep)}
.f span{font-size:11.5px; font-weight:700; color:var(--soft)}
.slider input[type=range]{accent-color:var(--brand)}
.split-fill{background:var(--brand); opacity:1}
.split-track{background:var(--brand-tint)}

/* --- AI栄養士 --- */
.coach{border:none; border-radius:var(--r); box-shadow:0 1px 3px rgba(22,35,28,.06)}
.coach-avatar{background:var(--brand); font-size:17px}
.coach-head strong{font-family:var(--font-round); font-size:14.5px}
.coach-text{font-size:14.5px}

/* --- 空の状態 --- */
.empty{border:none; border-radius:var(--r); background:var(--paper); box-shadow:0 1px 3px rgba(22,35,28,.06)}
.empty-title{font-family:var(--font-round); font-size:17px; color:var(--brand-deep)}

:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

/* --- 7日間の記録ドット --- */
.strip-week{margin-left:auto; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
.strip-week-label{font-size:10px; color:var(--soft)}
.strip-dots{gap:7px}
.wk{display:flex; flex-direction:column; align-items:center; gap:3px}
.wk i{font-style:normal; font-size:9px; color:var(--soft); line-height:1}
.dot{width:8px; height:8px; background:var(--brand-tint); border:1px solid var(--brand-soft)}

/* ============ ユーティリティ ============ */

/* ============ 計算 ============ */
const KCAL_PER_KG = 7200;   // 体脂肪1kgを減らすのに必要なおよそのカロリー
function calcTarget(p){
  const bmr = p.sex==="male"
    ? 10*p.weight + 6.25*p.height - 5*p.age + 5
    : 10*p.weight + 6.25*p.height - 5*p.age - 161;
  const tdee = bmr * p.activity;
  const wantCut = p.goal==="keep" ? 0 : (+p.paceKg||0.25) * KCAL_PER_KG / 7;
  const target  = Math.max(1200, Math.round((tdee - wantCut)/10)*10);
  const cut     = Math.max(0, Math.round(tdee) - target);   // 下限1200で削られたあとの実際の差
  const days    = (p.goal==="keep" || cut<=0) ? 0
                : Math.ceil((+p.loseKg||0) * KCAL_PER_KG / cut);
  return { bmr:Math.round(bmr), tdee:Math.round(tdee), target, cut, days,
           limited: (tdee - wantCut) < 1200 };
}
function goalSummary(p){
  const c = calcTarget(p);
  if(p.goal==="keep") return "いまの体重（" + p.weight + "kg）を保つ設定です。";
  if(!c.days) return "いまの設定では減らすペースを作れません。活動量や目標を見直してください。";
  const d = new Date(); d.setDate(d.getDate() + c.days);
  const term = c.days < 60 ? "約" + Math.max(1,Math.round(c.days/7)) + "週間"
                           : "約" + Math.round(c.days/30) + "か月";
  return (+p.loseKg||0) + "kg減らすのに " + term + "（" + (d.getFullYear()) + "年" + (d.getMonth()+1) + "月ごろ）。"
       + "1日あたり " + c.cut + "kcal 少なめに食べる計算です。";
}
function calcScore(t,p){
  if(t.kcal===0) return null;
  const diff = Math.abs(t.kcal - p.targetKcal)/p.targetKcal;
  const energy = Math.max(0, 50 - Math.max(0, diff-0.1)*250);
  const kc = t.protein*4 + t.fat*9 + t.carb*4 || 1;
  const gap = Math.abs(t.protein*4/kc*100 - p.ratio.p)
            + Math.abs(t.fat*9/kc*100 - p.ratio.f)
            + Math.abs(t.carb*4/kc*100 - p.ratio.c);
  return { total: Math.round(energy + Math.max(0, 30 - gap*0.6)) };
}
function goals(p){
  return { p:p.targetKcal*p.ratio.p/100/4, f:p.targetKcal*p.ratio.f/100/9, c:p.targetKcal*p.ratio.c/100/4 };
}
function streakDays(){
  let n=0, k=toKey(new Date());
  if(!(S.log[k]||[]).length) k=shiftDay(k,-1);
  while((S.log[k]||[]).length>0){ n++; k=shiftDay(k,-1); }
  return n;
}

/* ============ 画像 ============ */
function resize(file, maxSide, quality){
  // iPhoneの写真は既定がHEIC形式。Safariは開けるがChrome等は開けないため、
  // 2通りの方法を順に試し、どちらも駄目なときだけ案内を出す。
  const isHeic = /hei[cf]/i.test(file.type||"") || /\.hei[cf]$/i.test(file.name||"");

  const toJpeg = (src)=>{
    const s = Math.min(1, maxSide/Math.max(src.width,src.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(src.width*s); cv.height = Math.round(src.height*s);
    cv.getContext("2d").drawImage(src,0,0,cv.width,cv.height);
    return cv.toDataURL("image/jpeg", quality);
  };

  const viaBitmap = ()=> (typeof createImageBitmap === "function")
    ? createImageBitmap(file).then(toJpeg)
    : Promise.reject(new Error("未対応"));

  const viaImage = ()=> new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onerror = ()=>reject(new Error("画像を読み込めませんでした"));
    r.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("画像を表示できませんでした"));
      img.onload = ()=>resolve(toJpeg(img));
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });

  return viaBitmap().catch(()=>viaImage()).catch(e=>{
    throw new Error(isHeic
      ? "HEIC形式の写真は、このブラウザでは開けません。iPhoneの［設定］→［カメラ］→［フォーマット］を「互換性優先」にすると、次に撮る写真からJPEGになります。"
      : (e.message || "画像を読み込めませんでした"));
  });
}

/* ============ AI（中継役ごしに Gemini を呼ぶ） ============ */
function aiReady(){ return !!CFG.endpoint; }

async function callAI(parts, opts){
  opts = opts || {};
  if(!aiReady()) throw new Error("AI解析の接続先が未設定です");
  const body = {
    contents: [{ parts }],
    generationConfig: Object.assign(
      // thinkingLevel を low にしないと、モデルが長考して文字数を使い切り、
      // 答えが途中で切れる（JSONが閉じられない）ことがある。
      // 下限2000。少なく指定すると「考えるぶん」で使い切って答えが出ない。
      { maxOutputTokens: Math.max(opts.maxTokens || 8000, 2000), temperature: 0.2,
        thinkingConfig: { thinkingLevel: "low" } },
      opts.json ? { responseMimeType: "application/json" } : {}
    )
  };
  let res;
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 40000);
  try{
    res = await fetch(CFG.endpoint, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "x-app-token": CFG.token },
      body: JSON.stringify(body),
      signal: ctl.signal,
    });
  }catch(e){
    throw new Error(e.name==="AbortError" ? "時間内に応答がありませんでした" : "通信できませんでした");
  }finally{ clearTimeout(timer); }

  const text = await res.text();
  if(!res.ok) throw new Error(res.status + " " + text.slice(0,200));
  let data;
  try{ data = JSON.parse(text); }catch(e){ throw new Error("応答を読み取れませんでした"); }
  const cand = data.candidates && data.candidates[0];
  const out = cand && cand.content && cand.content.parts
    ? cand.content.parts.map(p=>p.text||"").join("") : "";
  if(!out) throw new Error("応答が空でした（" + ((cand&&cand.finishReason)||"理由不明") + "）");
  if(cand.finishReason === "MAX_TOKENS") throw new Error("答えが長すぎて途中で切れました。もう一度お試しください");
  return out;
}

function parseJson(text){
  const c = text.replace(/```json|```/g,"").trim();
  const s = c.indexOf("{"), e = c.lastIndexOf("}");
  return JSON.parse(s>=0 ? c.slice(s,e+1) : c);
}

function ringSvg(v, max){
  const size=132, r=(size-14)/2, circ=2*Math.PI*r;
  const ratio = max ? Math.min(1, v/max) : 0;
  const color = v>max ? COL.kaki : COL.wakakusa;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${COL.line}" stroke-width="10"/>
    <circle cx="66" cy="66" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${circ*ratio} ${circ}" transform="rotate(-90 66 66)"/>
  </svg>`;
}
function pfcBars(t, g){
  const rows=[["たんぱく質",t.protein,g.p,COL.ai],["脂質",t.fat,g.f,COL.yamabuki],["炭水化物",t.carb,g.c,COL.wakakusa]];
  return `<div class="pfc">${rows.map(r=>`
    <div class="pfc-row">
      <span class="pfc-label">${r[0]}</span>
      <div class="pfc-track"><div class="pfc-fill" style="width:${Math.min(100,r[1]/r[2]*100)}%;background:${r[3]}"></div></div>
      <span class="pfc-num">${Math.round(r[1])}<i>/${Math.round(r[2])}g</i></span>
    </div>`).join("")}</div>`;
}
function barChart(days, target){
  // 上に余白を作り、目標ラベルは棒が届かない位置（グラフの外）に置く
  const W=340, H=214, top=48, base=H-36, slot=(W-6)/7;
  const max = Math.max(target*1.25, ...days.map(d=>d.kcal), 1);
  const y  = v => base - (v/max)*(base-top);
  const ty = y(target);
  const bars = days.map((d,i)=>{
    const cx = 3 + i*slot + slot/2;
    const bw = Math.min(30, slot-10);
    const x  = cx - bw/2;
    const has = d.kcal > 0;
    const h  = has ? Math.max(4, base - y(d.kcal)) : 0;
    const isToday = d.key === S.dateKey;
    const over = d.kcal > target;
    const fill = over ? COL.kaki : "#2F8F5B";
    const dd = parseKey(d.key).getDate();
    return `
      ${has
        ? `<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="6" fill="${fill}" opacity="${isToday?1:.5}"/>
           <text x="${cx}" y="${base-h-7}" font-size="10.5" text-anchor="middle"
                 fill="${isToday?fill:COL.soft}" font-weight="${isToday?"700":"400"}">${Math.round(d.kcal)}</text>`
        : `<rect x="${x}" y="${base-5}" width="${bw}" height="5" rx="2.5" fill="${COL.line}"/>`}
      <text x="${cx}" y="${base+16}" font-size="10.5" text-anchor="middle"
            fill="${isToday?"#1F6B42":COL.soft}" font-weight="${isToday?"700":"400"}">${d.label}</text>
      <text x="${cx}" y="${base+28}" font-size="9.5" fill="${COL.soft}" text-anchor="middle">${dd}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="214" role="img" aria-label="7日間のカロリーの棒グラフ">
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="${COL.line}"/>
    <line x1="0" y1="${ty}" x2="${W}" y2="${ty}" stroke="${COL.kaki}" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/>
    <line x1="${W-118}" y1="14" x2="${W-96}" y2="14" stroke="${COL.kaki}" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="${W-90}" y="17.5" font-size="10.5" fill="${COL.kaki}">目標 ${target}kcal</text>
    ${bars}
  </svg>`;
}
function donut(t){
  const seg=[["たんぱく質",t.protein*4,COL.ai],["脂質",t.fat*9,COL.yamabuki],["炭水化物",t.carb*4,COL.wakakusa]];
  const total = seg.reduce((a,s)=>a+s[1],0);
  if(!total) return `<p class="cap">今日の記録がまだありません。</p>`;
  const r=52, circ=2*Math.PI*r; let off=0;
  const rings = seg.map(s=>{
    const len = s[1]/total*circ;
    const el = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s[2]}" stroke-width="24"
      stroke-dasharray="${len-2} ${circ-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;
    off += len; return el;
  }).join("");
  return `<div class="donut-wrap">
    <svg viewBox="0 0 140 140" width="140" height="140">${rings}</svg>
    <ul class="legend">${seg.map(s=>`<li><span class="sw" style="background:${s[2]}"></span>${s[0]}<b>${Math.round(s[1]/total*100)}%</b></li>`).join("")}</ul>
  </div>`;
}

/* ============ 描画：タイムライン ============ */
const R0=5*60, R1=25*60;
const railY = m => (Math.min(R1,Math.max(R0,m))-R0)/(R1-R0)*100;

function timelineHtml(entries){
  if(!entries.length){
    return `<div class="empty">
      <p class="empty-title">今日の1食目を記録しましょう</p>
      <p class="empty-sub">${aiReady() ? "写真を撮れば、料理名とカロリーはAIが下書きします。" : "料理を選ぶだけで、カロリーとPFCが入ります。"}</p>
      <button class="btn btn-primary" data-act="open-sheet">食事を記録する</button>
    </div>`;
  }
  const map = new Map();
  entries.forEach(e=>{
    const k = e.meal+"@"+e.time;
    if(!map.has(k)) map.set(k, {meal:e.meal, time:e.time, items:[]});
    map.get(k).items.push(e);
  });
  const groups = [...map.values()].sort((a,b)=>mins(a.time)-mins(b.time));
  const ticks = [6,9,12,15,18,21,24].map(h=>
    `<div class="tl-tick" style="top:${railY(h*60)}%"><span>${h===24?0:h}</span></div>`).join("");
  const body = groups.map(g=>{
    const s = sum(g.items);
    const items = g.items.map(e=>`
      <button class="item" data-act="edit" data-id="${e.id}">
        ${e.thumb ? `<img class="item-thumb" src="${e.thumb}" alt="">`
                  : `<span class="item-thumb item-thumb-blank">${esc(e.name.slice(0,1))}</span>`}
        <span class="item-body">
          <span class="item-name">${esc(e.name)}</span>
          <span class="item-portion">${esc(e.portion||"1人前")}</span>
        </span>
        <span class="item-kcal">${Math.round(e.kcal)}</span>
      </button>`).join("");
    return `<div class="tl-group">
      <div class="tl-dot" style="background:${g.meal==="snack"?COL.yamabuki:COL.ai}"></div>
      <div class="tl-head"><span class="tl-time">${g.time}</span><span class="tl-meal">${ML[g.meal]}</span>
        <span class="tl-kcal num">${Math.round(s.kcal)}<i>kcal</i></span></div>
      <div class="tl-items">${items}</div>
    </div>`;
  }).join("");
  return `<div class="tl"><div class="tl-rail"><div class="tl-line"></div>${ticks}</div>
    <div class="tl-body">${body}</div></div>`;
}

  const before = prevWeight(today);
  const diff = (w && before != null) ? Math.round((w - before)*10)/10 : null;
  const diffTag = diff !== null
    ? `<em class="wdiff ${diff<=0?"is-down":"is-up"}">${diff>0?"+":""}${diff.toFixed(1)}kg</em>` : "";

  // 記録済みの日は一行に畳んで、場所を取らないようにする

  return `<section class="card wcard">

function goalProgress(){
  const p = S.profile;
  if(p.goal !== "lose") return "";
  const st = startWeight(), now = latestWeight(), want = +p.loseKg || 0;
  if(!want) return "";
  const done = Math.round((st - now)*10)/10;
  const pct  = Math.max(0, Math.min(100, Math.round(done / want * 100)));
  const rest = Math.round((want - done)*10)/10;
  return `<section class="card"><h2 class="h">目標までの進み具合</h2>
    <div class="prog-head">
      <span>開始 <b class="num">${st.toFixed(1)}</b>kg</span>
      <span class="prog-arrow">→</span>
      <span>いま <b class="num">${now.toFixed(1)}</b>kg</span>
      <em class="prog-pct">${pct}%</em>
    </div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-foot">
      <span>${done > 0 ? `<b>${done.toFixed(1)}kg</b> 減りました` : (done < 0 ? `<b>${Math.abs(done).toFixed(1)}kg</b> 増えています` : "まだ変化はありません")}</span>
      <span>${rest > 0 ? `目標まであと <b>${rest.toFixed(1)}kg</b>` : "目標を達成しました！"}</span>
    </div>
    <p class="cap">体重を記録すると、ここが進みます。開始の体重は「目標」タブで「この目標にする」を押したときの値です。</p>
  </section>`;
}

function weightChart(){
  const N = 14;
  const days = [];
  for(let i=N-1;i>=0;i--){ const k = shiftDay(S.dateKey,-i); days.push({ key:k, w:S.weights[k] }); }
  const pts = days.map((d,i)=>({i, w:d.w ? +d.w : null, key:d.key})).filter(d=>d.w);
  if(!pts.length) return `<p class="cap">まだ体重の記録がありません。「記録」タブの「からだの記録」から入力できます。</p>`;

  const p = S.profile;
  const goalW = p.goal==="lose" ? startWeight() - (+p.loseKg||0) : null;
  const vals = pts.map(d=>d.w).concat(goalW ? [goalW] : []);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi - lo < 1){ const c = (hi+lo)/2; lo = c - 0.6; hi = c + 0.6; }
  const m = (hi - lo) * 0.18; lo -= m; hi += m;

  const W=340, H=180, top=16, base=H-30, left=36;
  const x = i => left + i*((W-left-10)/(N-1));
  const y = v => base - ((v-lo)/(hi-lo))*(base-top);

  const line = pts.map((d,i)=>`${i?"L":"M"}${x(d.i).toFixed(1)} ${y(d.w).toFixed(1)}`).join(" ");
  const last = pts[pts.length-1];
  const dots = pts.map(d=>{
    const isLast = d === last;
    return `<circle cx="${x(d.i).toFixed(1)}" cy="${y(d.w).toFixed(1)}" r="${isLast?4.5:3}"
             fill="${isLast?"#1F6B42":"#2F8F5B"}" stroke="#fff" stroke-width="${isLast?2:1.5}"/>`;
  }).join("");

  const ticks = [0, Math.floor((N-1)/2), N-1].map(i=>{
    const d = parseKey(days[i].key);
    return `<text x="${x(i)}" y="${base+18}" font-size="9.5" fill="${COL.soft}" text-anchor="middle">${d.getMonth()+1}/${d.getDate()}</text>`;
  }).join("");

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="180" role="img" aria-label="体重の推移">
    <line x1="${left}" y1="${base}" x2="${W-4}" y2="${base}" stroke="${COL.line}"/>
    <text x="${left-6}" y="${top+4}" font-size="9.5" fill="${COL.soft}" text-anchor="end">${hi.toFixed(1)}</text>
    <text x="${left-6}" y="${base+3}" font-size="9.5" fill="${COL.soft}" text-anchor="end">${lo.toFixed(1)}</text>
    ${goalW ? `<line x1="${left}" y1="${y(goalW).toFixed(1)}" x2="${W-4}" y2="${y(goalW).toFixed(1)}"
        stroke="#2F8F5B" stroke-width="1.2" stroke-dasharray="5 4" opacity=".8"/>
      <rect x="${W-84}" y="${(y(goalW)-15).toFixed(1)}" width="80" height="14" rx="7" fill="#E4F2E9"/>
      <text x="${W-44}" y="${(y(goalW)-4.5).toFixed(1)}" font-size="9" fill="#1F6B42" text-anchor="middle">目標 ${goalW.toFixed(1)}kg</text>` : ""}
    <path d="${line}" fill="none" stroke="#2F8F5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    <text x="${x(last.i)}" y="${Math.max(11, y(last.w)-10).toFixed(1)}" font-size="11" font-weight="700"
          fill="#1F6B42" text-anchor="middle">${last.w.toFixed(1)}kg</text>
    ${ticks}
  </svg>`;
}

    <section class="card"><h2 class="h">食事ごとの内訳</h2>
      <div class="split">${share.map(m=>`
        <div class="split-row2">
          <div class="split-head">
            <b class="split-name">${m.name}</b>
            <span class="split-n">${m.n ? m.n+"品" : "記録なし"}</span>
            <span class="split-kcal"><b class="num">${m.kcal}</b>kcal${
              dayKcal ? ` <i>${Math.round(m.kcal/dayKcal*100)}%</i>` : ""}</span>

function openSheet(editing){
  if(editing){
    S.sheet = { meal:editing.meal, time:editing.time, tab:"manual", thumb:editing.thumb||null,
      status:null, query:"", editingId:editing.id,
      drafts:[{name:editing.name, portion:editing.portion, kcal:editing.kcal,
               protein:editing.protein, fat:editing.fat, carb:editing.carb}] };
  }else{
    const now = new Date(), h = now.getHours();
    S.sheet = {
      meal: h<10?"breakfast":h<15?"lunch":h<21?"dinner":"snack",
      time: pad(h)+":"+pad(Math.floor(now.getMinutes()/5)*5),
      tab: aiReady() ? "photo" : "search",
      drafts: [], thumb:null, status:null, query:"", editingId:null
    };
  }
  renderSheet();
}
function closeSheet(){ S.sheet=null; $("#sheet").innerHTML=""; }

function draftTotal(){ return sum(S.sheet.drafts); }

// 同じ食事区分で、直近（最大7日前まで）に記録がある日を探す
function lastSameMeal(mealKey, beforeKey){
  for(let i=1;i<=7;i++){
    const k = shiftDay(beforeKey, -i);
    const es = (S.log[k]||[]).filter(e=>e.meal===mealKey);
    if(es.length) return { key:k, entries:es, total:sum(es) };
  }
  return null;
}

async function handleFile(file){
  if(!file || !S.sheet) return;
  if(quotaLeft("photo") <= 0){
    S.sheet.status = {type:"error",
      text:"本日の写真解析（1日"+LIMITS.photo+"回まで）を使い切りました。日付が変わるとまた使えます。「さがす」や「手入力」なら今すぐ記録できます。"};
    renderSheet(); return;
  }
  S.sheet.status = {type:"loading", text:"写真から料理を読み取っています"};
  renderSheet();
  try{
    const big = await resize(file, 1024, 0.8);
    const small = await resize(file, 128, 0.6);
    S.sheet.thumb = small;
    const r = await analyzeImage(big);
    if(!r.items || !r.items.length){
      S.sheet.status = {type:"error", text:r.note || "食事を判別できませんでした。手入力に切り替えてください。"};
    }else{
      S.sheet.drafts = r.items.map(it=>({
        name: it.name||"料理", portion: it.portion||"",
        kcal: Math.round(it.kcal||0),
        protein: Math.round((it.protein||0)*10)/10,
        fat: Math.round((it.fat||0)*10)/10,
        carb: Math.round((it.carb||0)*10)/10,
        confidence: it.confidence
      }));
      S.sheet.status = {type:"note", text:r.note || "推定値です。ちがうところは直してください。"};
      S.sheet.fromPhoto = true;   // 実際に記録した時点で1回消費する
    }
  }catch(e){
    S.sheet.status = {type:"error", text:"解析できませんでした。手入力でも記録できます。", detail:String(e.message||e)};
  }
  renderSheet();
}

function saveEntries(){
  const s = S.sheet;
  const rows = s.drafts.filter(d=>String(d.name||"").trim()).map(d=>({
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    name:String(d.name).trim(), portion:d.portion||"",
    kcal:+d.kcal||0, protein:+d.protein||0, fat:+d.fat||0, carb:+d.carb||0,
    meal:s.meal, time:s.time, thumb:s.thumb||null
  }));
  if(!rows.length) return;
  if(s.fromPhoto) useQuota("photo");   // 解析しただけでは消費せず、保存できて初めて1回とする
  let day = (S.log[S.dateKey]||[]).slice();
  if(s.editingId) day = day.filter(e=>e.id!==s.editingId);
  S.log[S.dateKey] = day.concat(rows).sort((a,b)=>mins(a.time)-mins(b.time));
  saveMonth(ym(S.dateKey));

  const favs = S.profile.favorites.slice();
  rows.forEach(r=>{
    const i = favs.findIndex(f=>f.name===r.name);
    if(i>=0) favs.splice(i,1);
    favs.unshift({name:r.name, portion:r.portion, kcal:r.kcal, protein:r.protein, fat:r.fat, carb:r.carb});
  });
  S.profile.favorites = favs.slice(0,24);
  saveProfile();

  S.coach = {text:"", loading:false};
  closeSheet(); render();
}

function csvCell(v){
  const t = String(v==null ? "" : v);
  return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
}
function r1(n){ return Math.round((+n||0)*10)/10; }

function buildCsv(){
  const rows = [["日付","食事","時刻","料理名","分量","カロリー(kcal)","たんぱく質(g)","脂質(g)","炭水化物(g)","体重(kg)"]];
  const dates = Array.from(new Set(Object.keys(S.log).concat(Object.keys(S.weights)))).sort();
  dates.forEach(date=>{
    const es = (S.log[date]||[]).slice().sort((a,b)=>mins(a.time)-mins(b.time));
    const w  = S.weights[date] != null ? r1(S.weights[date]) : "";
    if(!es.length){                       // 食事の記録がなく体重だけの日も残す
      rows.push([date,"","","","","","","","", w]); return;
    }
    es.forEach((e,i)=>{
      const m = MEALS.filter(x=>x.key===e.meal)[0];
      rows.push([date, m?m.label:(e.meal||""), e.time||"", e.name||"", e.portion||"",
                 Math.round(e.kcal||0), r1(e.protein), r1(e.fat), r1(e.carb), i===0 ? w : ""]);
    });
  });
  // 先頭のBOMは、Excelで開いたときに日本語が化けないようにするための印
  return "\uFEFF" + rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
}

async function saveFile(name, text, mime){
  const blob = new Blob([text], {type:mime});
  try{
    const file = new File([blob], name, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});   // iPhoneは共有シートから保存できる
      return;
    }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}

function countEntries(){
  return Object.keys(S.log).reduce((n,k)=>n+(S.log[k]||[]).length, 0)
       + Object.keys(S.weights).length;
}
function exportCsv(){
  if(!countEntries()){ S.dataMsg = "まだ記録がありません。"; render(); return; }
  saveFile("めしノート-" + toKey(new Date()) + ".csv", buildCsv(), "text/csv");
}

  const data = JSON.stringify({version:2, savedAt:new Date().toISOString(),
                               profile:S.profile, log:S.log, weights:S.weights});
  saveFile("めしノート-バックアップ-" + toKey(new Date()) + ".json", data, "application/json");
}
function importBackup(file){
  const r = new FileReader();
  r.onerror = ()=>{ S.dataMsg = "ファイルを開けませんでした。"; render(); };
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!d || typeof d!=="object" || !d.log) throw new Error("形式が違います");
      const n = Object.keys(d.log).reduce((a,k)=>a+((d.log[k]||[]).length), 0);
      if(!confirm("いまの記録を、このバックアップ（" + n + "件）で置き換えます。よろしいですか？")) return;
      S.profile = Object.assign({}, DEFAULT_PROFILE, d.profile||{});
      S.log = d.log;
      S.weights = d.weights || {};
      saveProfile(); saveWeights();
      for(let i=localStorage.length-1;i>=0;i--){
        const k = localStorage.key(i);
        if(k && k.indexOf("meshinote:log:")===0) localStorage.removeItem(k);
      }
      const months = {};
      Object.keys(S.log).forEach(k=>{ months[ym(k)] = 1; });
      Object.keys(months).forEach(saveMonth);
      S.dataMsg = n + "件の記録を復元しました。";
    }catch(e){
      S.dataMsg = "このファイルは読み込めませんでした。めしノートで保存したバックアップを選んでください。";
    }
    render();
  };
  r.readAsText(file);
}

/* ============ イベント ============ */
document.addEventListener("click", async (ev)=>{
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act==="view"){ S.view = el.dataset.view; S.dataMsg=null; render(); return; }
  if(act==="prev"){ S.dateKey = shiftDay(S.dateKey,-1); S.coach={text:"",loading:false}; render(); return; }  // 保存済みの診断は S.quota.coachText に残る
  if(act==="next"){ if(S.dateKey<toKey(new Date())){ S.dateKey = shiftDay(S.dateKey,1); S.coach={text:"",loading:false}; render(); } return; }
  if(act==="open-sheet"){ openSheet(null); return; }
  if(act==="edit"){
    const e = (S.log[S.dateKey]||[]).find(x=>x.id===el.dataset.id);
    if(e) openSheet(e);
    return;
  }
  if(act==="close"){ closeSheet(); return; }
  if(act==="meal"){
    S.sheet.meal = el.dataset.meal;
    if(!S.sheet.editingId){ const m = MEALS.find(x=>x.key===S.sheet.meal); S.sheet.time = m.t; }
    renderSheet(); return;
  }
  if(act==="tab"){ S.sheet.tab = el.dataset.tab; renderSheet(); return; }
  if(act==="pick"){ $("#pick").click(); return; }
  if(act==="shot"){ $("#shot").click(); return; }
  if(act==="copy-prev"){
    const prev = lastSameMeal(S.sheet.meal, S.dateKey);
    if(prev){
      prev.entries.forEach(e=>S.sheet.drafts.push({
        name:e.name, portion:e.portion||"",
        kcal:Math.round(e.kcal||0),
        protein:Math.round((e.protein||0)*10)/10,
        fat:Math.round((e.fat||0)*10)/10,
        carb:Math.round((e.carb||0)*10)/10
      }));
      S.sheet.status = {type:"note", text:fmtShort(prev.key)+"の記録を写しました。量がちがうときは直してください。"};
      S.sheet.tab = "manual";
    }
    renderSheet(); return;
  }
  if(act==="add-blank"){ S.sheet.drafts.push({name:"",portion:"",kcal:"",protein:"",fat:"",carb:""}); S.sheet.tab="manual"; renderSheet(); return; }
  if(act==="rm-draft"){ S.sheet.drafts.splice(+el.dataset.i,1); renderSheet(); return; }
  if(act==="add-food"){
    const q = S.sheet.query.trim();
    const list = q ? FOODS.filter(f=>f.name.indexOf(q)>=0).slice(0,20) : S.profile.favorites.slice(0,8);
    const f = list[+el.dataset.i];
    if(f) addFood(f);
    return;
  }
  if(act==="ai-text"){
    const q = S.sheet.query.trim();
    if(quotaLeft("text") <= 0){
      S.sheet.status = {type:"error",
        text:"本日のAI推定（1日"+LIMITS.text+"回まで）を使い切りました。日付が変わるとまた使えます。"};
      renderSheet(); return;
    }
    S.sheet.status = {type:"loading", text:"「"+q+"」の栄養価を調べています"};
    renderSheet();
    useQuota("text");
    try{
      let r;
      try{ r = await analyzeText(q); }
      catch(err){ refundQuota("text"); throw err; }   // 届かなかった分は回数を戻す
      if(r.items && r.items.length){
        const it = r.items[0];
        S.sheet.status = {type:"note", text:"AIの推定値です。分量に合わせて直せます。"};
        addFood({name:it.name, portion:it.portion, kcal:Math.round(it.kcal||0),
          protein:it.protein||0, fat:it.fat||0, carb:it.carb||0});
        return;
      }
      S.sheet.status = {type:"error", text:"見つかりませんでした。手入力で登録できます。"};
    }catch(e){
      S.sheet.status = {type:"error", text:"調べられませんでした。手入力で登録できます。", detail:String(e.message||e)};
    }
    renderSheet(); return;
  }
  if(act==="save"){ saveEntries(); return; }
  if(act==="delete"){
    S.log[S.dateKey] = (S.log[S.dateKey]||[]).filter(e=>e.id!==S.sheet.editingId);
    saveMonth(ym(S.dateKey)); closeSheet(); render(); return;
  }
  if(act==="coach"){
    if(quotaLeft("coach") <= 0){ render(); return; }
    S.coach = {text:"", loading:true}; render();
    useQuota("coach");
    try{
      const entries = S.log[S.dateKey]||[];
      const text = await coachComment(sum(entries), entries);
      S.coach = {text, loading:false};
      S.quota.coachText = text; saveQuota();          // 読み返せるように残す
    }catch(e){
      refundQuota("coach");                            // 届かなかったので回数は戻す
      S.coach = {text:"いまアドバイスを受け取れませんでした（"+(e.message||e)+"）。もう一度お試しください。", loading:false};
    }
    render(); return;
  }
  if(act==="edit-weight"){ S.editWeight = true; render(); return; }
  if(act==="cancel-weight"){ S.editWeight = false; render(); return; }
  if(act==="save-weight"){
    const box = $("#wIn");
    const v = box ? parseFloat(box.value) : NaN;
    if(isNaN(v) || v < 20 || v > 250){ alert("体重を20〜250kgの範囲で入力してください。"); return; }
    S.weights[S.dateKey] = Math.round(v*10)/10;
    saveWeights();
    S.profile.weight = Math.round(v*10)/10;   // 目標カロリーの計算も最新の体重に合わせる
    saveProfile();
    S.editWeight = false;
    render(); return;
  }
  if(act==="apply-target"){
    S.profile.targetKcal = calcTarget(S.profile).target;
    S.profile.startWeight = +S.profile.weight;      // 目標を決めた時点を起点にする
    S.profile.startDate = toKey(new Date());
    saveProfile(); render(); return;
  }
  if(act==="export-csv"){ S.dataMsg=null; exportCsv(); return; }
  if(act==="export-json"){ S.dataMsg=null; exportBackup(); return; }
  if(act==="import-json"){ S.dataMsg=null; $("#restore").click(); return; }
});

/* 入力中に画面全体を作り直すと、打っている入力欄ごと作り替えられて
   iPhoneのキーボードが閉じてしまう。入力中は「値の保存」と
   「関係する表示だけの更新」にとどめ、作り直しは選択後や離れたあとに行う。 */
function refreshCalc(){
  const c = calcTarget(S.profile);
  const put = (id,v)=>{ const el = document.getElementById(id); if(el) el.textContent = v; };
  put("calc-bmr", c.bmr); put("calc-tdee", c.tdee); put("calc-target", c.target);
  const g = document.getElementById("goal-summary");
  if(g) g.textContent = goalSummary(S.profile);
}
const TEXT_KEYS = ["nickname","sex","goal"];

document.addEventListener("input", (ev)=>{
  const el = ev.target;

  if(el.id==="q"){
    S.sheet.query = el.value;
    const body = $("#search-body");
    if(body) body.innerHTML = searchBodyHtml();   // 入力欄は触らない
    return;
  }
  if(el.id==="time"){ S.sheet.time = el.value; return; }

  if(el.dataset.d !== undefined){
    const d = S.sheet.drafts[+el.dataset.d];
    if(d){ d[el.dataset.k] = el.value; refreshFoot();
      const btn = document.querySelector('[data-act="save"]');
      if(btn) btn.disabled = !S.sheet.drafts.filter(x=>String(x.name||"").trim()).length; }
    return;
  }

  if(el.dataset.ratio){
    S.profile.ratio[el.dataset.ratio] = +el.value;
    const b = el.parentElement && el.parentElement.querySelector("b");
    if(b) b.textContent = el.value + "%";
    saveProfile(); return;
  }

  if(el.dataset.p){
    const k = el.dataset.p;
    if(TEXT_KEYS.indexOf(k) < 0 && el.value === "") return;   // 消している途中は確定しない
    S.profile[k] = TEXT_KEYS.indexOf(k) >= 0 ? el.value : +el.value;
    saveProfile(); refreshCalc(); return;
  }
});

document.addEventListener("change", (ev)=>{
  const el = ev.target;
  if(el.dataset.ratio){ saveProfile(); render(); return; }
  if(el.dataset.p){
    const k = el.dataset.p;
    if(TEXT_KEYS.indexOf(k) < 0 && el.value === ""){   // 空欄のまま離れたら既定値に戻す
      S.profile[k] = DEFAULT_PROFILE[k];
      saveProfile(); render(); return;
    }
    S.profile[k] = TEXT_KEYS.indexOf(k) >= 0 ? el.value : +el.value;
    saveProfile();
    if(el.tagName === "SELECT") render(); else refreshCalc();
  }
});

$("#pick").addEventListener("change", e=>{ handleFile(e.target.files[0]); e.target.value=""; });
$("#shot").addEventListener("change", e=>{ handleFile(e.target.files[0]); e.target.value=""; });
$("#restore").addEventListener("change", e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); e.target.value=""; });

/* ============ 起動 ============ */
render();
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
